
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: mimiee-dev
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23EF93C4&color_dots=%23FFF0F6,%23FFD6E7,%23F8BBD0,%23EF93C4,%23D96AA5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23EF93C4

      - name: Publish snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
